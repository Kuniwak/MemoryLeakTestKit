name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  swiftpm-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  swiftpm-linux:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  podspec:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Lint the podspec
        run: bundle exec pod lib lint
